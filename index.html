<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>G1Sword2H14z</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "FangSong", sans-serif;
      background-color: #bdf2ed; 
      color: #333; 
      /* 🌟 修复：用隐藏滚动条代替 overflow: hidden，防止手机端滑动失效 */
      -ms-overflow-style: none; 
      scrollbar-width: none; 
    }
    body::-webkit-scrollbar { display: none; }

    /* --- 导航栏 --- */
    .navbar {
      position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 20px 50px; background-color: rgba(70, 87, 126, 0.8); backdrop-filter: blur(10px); z-index: 100;
    }
    
    .logo { font-size: 24px; font-weight: bold; color: #38bdf8; cursor: pointer; user-select: none; }
    
    .nav-links a { 
      color: white; text-decoration: none; margin-left: 30px; font-size: 16px; 
      transition: all 0.3s; padding-bottom: 5px; border-bottom: 2px solid transparent; 
    }
    .nav-links a:hover { color: #38bdf8; }
    .nav-links a.active { color: #38bdf8; font-weight: bold; border-bottom: 2px solid #38bdf8; }

    /* --- 每一屏的通用设置 --- */
    .screen {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
    }

    /* 首屏区域 */
    .hero { background: radial-gradient(circle at center, #1047a0 0%, #2656c5 100%); }
    .hero h1 {
      font-size: 60px; margin-bottom: 20px;
      background: linear-gradient(to right, #38bdf8, #b8e89e);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { font-size: 20px; color: #e1e6ed; margin-bottom: 40px; }
    .btn {
      padding: 15px 40px; font-size: 18px; color: white; background: linear-gradient(to right, #38bdf8, #73c4e4);
      border: none; border-radius: 30px; cursor: pointer; text-decoration: none; transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.4); }

    /* --- 下方的内容区块 --- */
    .content-section { background-color: #f8fbfb; padding: 0 50px; }
    .content-section:nth-of-type(even) { background-color: #eaf6f4; }
    .section-container {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1100px; width: 100%; gap: 60px;
    }
    .section-image {
      flex: 1; height: 400px; border-radius: 20px; overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    }
    .section-image img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.5s; }
    .section-image:hover img { transform: scale(1.05); }
    .section-text { flex: 1; text-align: left; }
    .section-text h2 { font-size: 40px; color: #2656c5; margin-bottom: 20px; }
    .section-text p { font-size: 18px; color: #555; line-height: 1.8; }

    /* 手机端适配 */
    @media (max-width: 768px) {
      .navbar { padding: 15px 20px; }
      .nav-links a { margin-left: 15px; font-size: 14px; }
      .section-container { flex-direction: column; gap: 30px; }
      .section-text h2 { text-align: center; }
      .section-text p { text-align: justify; }
      .hero h1 { font-size: 40px; }
      .section-image { height: 250px; }
    }

    /* --- 🌟 彩蛋弹窗样式 --- */
    .egg-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .egg-modal.show { opacity: 1; pointer-events: auto; }
    .egg-content {
      background: #e8e6da; padding: 15px 20px; border-radius: 12px; text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3); transform: scale(0.8); 
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      max-width: 250px; width: 90%; 
    }
    .egg-modal.show .egg-content { transform: scale(1); }
    .egg-content p { color: #b45309; font-size: 18px; font-weight: bold; margin: 0; font-family: "Verdana", serif; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo" id="logo-trigger">Adremofven</div>
    <div class="nav-links">
      <a href="#home" class="nav-item active">首页</a>
      <a href="#world" class="nav-item">思考</a>
      <a href="#nature" class="nav-item">生命</a>
      <a href="#protect" class="nav-item">立场</a>
    </div>
  </nav>

  <div id="home" class="screen hero">
    <h1>你好，我是 Adremofven</h1>
    <p>如果你想更了解我</p>
    <a href="#world" class="btn nav-item">请点击这里</a>
  </div>

  <div id="world" class="screen content-section">
    <div class="section-container">
      <div class="section-image"><img src="thought.jpg" alt="世界"></div>
      <div class="section-text">
        <h2>思考</h2>
        <p>世界不是由答案组成，而是由条件组成。很多观点放在不同的时代、不同的环境、不同的角色下，都可能成立。理解不同观点为什么会产生，并且知道它们各自适用的边界。我觉得，这也是思考的意义——不是为了证明自己是对的，而是让自己越来越接近真实。</p>
      </div>
    </div>
  </div>

  <div id="nature" class="screen content-section">
    <div class="section-container">
      <div class="section-text">
        <h2>生命</h2>
        <p>这里曾经有一些话语但是本人嫌弃它们过于无病呻吟且肉麻所以换掉了。T-T</p>
      </div>
      <div class="section-image"><img src="life.jpg" alt="自然"></div>
    </div>
  </div>

  <div id="protect" class="screen content-section">
    <div class="section-container">
      <div class="section-image"><img src="stance.jpg" alt="保护"></div>
      <div class="section-text">
        <h2>立场</h2>
        <p>同上所述，输出观点需要勇气.....</p>
      </div>
    </div>
  </div>

  <div class="egg-modal" id="egg-modal">
    <div class="egg-content">
      <p>万物皆有灵</p>
    </div>
  </div>

  <script>
    let isScrolling = false;
    let currentPage = 0;
    const screens = document.querySelectorAll('.screen');
    const navLinks = document.querySelectorAll('.nav-links a');

    function updateNav(index) {
      navLinks.forEach(link => link.classList.remove('active'));
      if (index >= 0 && index < navLinks.length) {
        navLinks[index].classList.add('active');
      }
    }

    function scrollToScreen(index, duration = 1200) { 
      if (isScrolling || index < 0 || index >= screens.length) return;
      isScrolling = true;
      currentPage = index;
      updateNav(index);

      const startY = window.scrollY;
      const targetY = screens[index].offsetTop;
      const distance = targetY - startY;
      let startTime = null;

      function easeInOutCubic(t, b, c, d) {
        t /= d / 2;
        if (t < 1) return c / 2 * t * t * t + b;
        t -= 2;
        return c / 2 * (t * t * t + 2) + b;
      }

      function animation(currentTime) {
        if (startTime === null) startTime = currentTime;
        const timeElapsed = currentTime - startTime;
        const run = easeInOutCubic(timeElapsed, startY, distance, duration);
        window.scrollTo(0, run);
        if (timeElapsed < duration) {
          requestAnimationFrame(animation);
        } else {
          isScrolling = false; 
        }
      }
      requestAnimationFrame(animation);
    }

    // 监听鼠标滚轮（电脑）
    window.addEventListener('wheel', (e) => {
      if (document.getElementById('egg-modal').classList.contains('show')) return;
      if (isScrolling) return; 
      if (e.deltaY > 0) scrollToScreen(currentPage + 1);
      else if (e.deltaY < 0) scrollToScreen(currentPage - 1);
    }, { passive: false });

    // 🌟 新增：监听手机端触摸滑动
    let touchStartY = 0;
    let touchEndY = 0;

    window.addEventListener('touchstart', (e) => {
      // 如果彩蛋开着，就不记录滑动
      if (document.getElementById('egg-modal').classList.contains('show')) return;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      // 阻止默认的页面滚动，防止代码打架哈哈
      if (document.getElementById('egg-modal').classList.contains('show')) return;
      e.preventDefault(); 
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (document.getElementById('egg-modal').classList.contains('show')) return;
      touchEndY = e.changedTouches[0].clientY;
      
      const distance = touchStartY - touchEndY;
      if (isScrolling) return;

      // 手指滑动的距离超过 50 像素，才算有效滑动！！！！！！！！！！
      if (distance > 50) {
        // 向上滑（看下一页）
        scrollToScreen(currentPage + 1);
      } else if (distance < -50) {
        // 向下滑（回上一页）
        scrollToScreen(currentPage - 1);
      }
    }, { passive: false });

    // 导航栏点击
    document.querySelectorAll('.nav-item').forEach((link) => {
      link.addEventListener('click', (e) => {
        e.preventDefault(); 
        const targetId = link.getAttribute('href');
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          const index = Array.from(screens).indexOf(targetElement);
          scrollToScreen(index); 
        }
      });
    });

    // 彩蛋逻辑，拜拜
    const logoTrigger = document.getElementById('logo-trigger');
    const eggModal = document.getElementById('egg-modal');
    logoTrigger.addEventListener('dblclick', () => { eggModal.classList.add('show'); });
    eggModal.addEventListener('click', (e) => {
      if (e.target === eggModal) { eggModal.classList.remove('show'); }
    });
  </script>
</body>
</html>
